spring:
  application:
    name: workflow-orchestration
  datasource:
    url: jdbc:mysql://localhost:3306/ORCLPDB1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 9099

workflow:
  scheduler:
    retry-interval-ms: 60000

mock:
  actions:
    flex-posting-success-probability: 0.75
    accounting-success-probability: 0.9
    notification-success-probability: 0.95
    firco-approved-probability: 0.85
    firco-rejected-probability: 0.05
