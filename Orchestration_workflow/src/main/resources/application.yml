spring:
  application:
    name: workflow-orchestration
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/ORCLPDB1
    username: payment_user
    password: payment_pass
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 9099

workflow:
  scheduler:
    retry-interval-ms: 60000

mock:
  actions:
    flex-posting-success-probability: 0.75
    accounting-success-probability: 0.9
    notification-success-probability: 0.95
    firco-approved-probability: 0.85
    firco-rejected-probability: 0.05
