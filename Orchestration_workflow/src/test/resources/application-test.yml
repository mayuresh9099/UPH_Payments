spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ORCLPDB1
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root@123
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      database-platform: org.hibernate.dialect.MySQLDialect
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

workflow:
  scheduler:
    retry-interval-ms: 60000

mock:
  actions:
    flex-posting-success-probability: 1.0
    accounting-success-probability: 1.0
    notification-success-probability: 1.0
    firco-approved-probability: 1.0
    firco-rejected-probability: 0.0
