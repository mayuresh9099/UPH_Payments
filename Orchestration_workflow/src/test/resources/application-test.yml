spring:
  datasource:
    url: jdbc:h2:mem:workflow;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      database-platform: org.hibernate.dialect.H2Dialect
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false

workflow:
  scheduler:
    retry-interval-ms: 300000

mock:
  actions:
    flex-posting-success-probability: 1.0
    accounting-success-probability: 1.0
    notification-success-probability: 1.0
    firco-approved-probability: 1.0
    firco-rejected-probability: 0.0

