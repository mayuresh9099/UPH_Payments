spring:
  datasource:
    url: jdbc:h2:mem:workflow;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      database-platform: org.hibernate.dialect.H2Dialect
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
  security:
    user:
      name: testuser
      password: testpassword

workflow:
  definitions:
    PAYMENT:
      actions:
        - REQUEST_VALIDATION
        - FIRCO_SCREENING
        - PAYMENT_POSTING
        - ACCOUNTING
        - NOTIFICATION

mock:
  actions:
    payment-posting-success-probability: 1.0
    accounting-success-probability: 1.0
    notification-success-probability: 1.0
    firco-approved-probability: 1.0
    firco-rejected-probability: 0.0

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000
